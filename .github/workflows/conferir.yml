# O gate do estojo (OMINFRA-851): toda PR — inclusive de fora, o repo é público
# — passa pelo conferidor e pela geração antes de chegar à main.
#
# ⛔ `pull_request`, nunca `pull_request_target`: a PR de fork roda sem segredo
# nenhum, e este workflow não precisa de nenhum. Permissão só de leitura.
# ⭐ Ações pinadas por SHA de commit (a tag `v4` anda sozinha); a versão fica no
# comentário (OMINFRA-835).
name: conferir

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: conteúdo, tokens, links, segredo e dado real
        run: node ferramentas/conferir.mjs
      # OMINFRA-832: o README não contradiz o conteúdo (as superfícies e os
      # casos contados, datas no retrato). Sem rede, só a biblioteca padrão do
      # Python do runner; o que ele confere está em `conferir/readme.json`.
      - name: o README não contradiz o repo (deriva documental)
        run: python3 conferir/conferir_readme.py
      - name: a casca se gera do conteúdo
        run: |
          npm run -s casca
          test -s casca/index.html || { echo "✗ a casca não gerou o índice" >&2; exit 1; }
      - name: a página do negócio (Alisson) se gera
        run: node alisson/pagina-do-negocio/gerar.mjs
